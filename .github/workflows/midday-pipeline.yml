name: Midday Risk Check

on:
  schedule:
    # 16:07 UTC = 12:07 PM ET (EDT, UTC-4) — the midday stop-loss check that
    # CLAUDE.md and routines.json have always described but nothing ran.
    #
    # Two more triggers inside the same 10 AM-4 PM ET market-hours window this
    # workflow's own guardrail already enforces. Unlike the morning pipeline,
    # this is not purely a delay workaround: check-stops and check-phantom are
    # read-check-act operations, so checking more often is strictly better —
    # it catches a stop-loss breach sooner, not just hedges against GitHub's
    # scheduler running hours late (observed: 3.5-9h delays this repo has
    # actually hit).
    #
    # Minutes moved off :00/:30 on 2026-09-18 — two of these three sat exactly
    # on the hour, the single most congested minute per GitHub's own scheduled-
    # workflow docs ("high load times include the start of every hour").
    # See morning-pipeline.yml's schedule comment for the full measurement
    # that motivated this across all of this agent's workflows.
    - cron: '7 16 * * 1-5'    # 12:07 PM ET
    - cron: '37 14 * * 1-5'   # 10:37 AM ET
    - cron: '7 18 * * 1-5'    # 2:07 PM ET
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Skip the market-hours guardrail (for testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  midday-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run midday risk check
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}
        run: |
          chmod +x run_midday_github.sh
          bash run_midday_github.sh

      - name: Commit logs back to repo
        if: always()
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@youversion.com"
          git add logs/paper/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: midday risk check $(TZ='America/New_York' date +%Y-%m-%d)"
          # This workflow runs three times inside market hours, and morning- and
          # options-pipeline.yml may commit to the same branch around the same
          # time — a single unretried push can lose a run's output to whichever
          # job wins the race (observed 2026-09-02 on morning vs. options).
          # Retry with fetch+rebase on rejection instead of one
          # `git pull --rebase || true` followed by an unconditional push.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing onto latest ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git stash --include-untracked --quiet || true
            if ! git rebase "origin/${{ github.ref_name }}"; then
              echo "::error::Rebase conflict against origin/${{ github.ref_name }} - manual intervention needed"
              git rebase --abort
              git stash pop --quiet || true
              exit 1
            fi
            git stash pop --quiet || true
          done
          echo "::error::Failed to push logs after 5 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload midday log as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: midday-log-${{ github.run_id }}
          path: logs/paper/
          # See morning-pipeline.yml's comment on this same setting — 30-day
          # retention across hourly runs on all 4 equities workflows exhausted
          # the repo's Actions artifact storage quota on 2026-10-20.
          retention-days: 1
