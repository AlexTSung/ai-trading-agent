name: Midday Risk Check

on:
  schedule:
    # 16:00 UTC = 12:00 PM ET (EDT, UTC-4) — the midday stop-loss check that
    # CLAUDE.md and routines.json have always described but nothing ran.
    #
    # Two more triggers inside the same 10 AM-4 PM ET market-hours window this
    # workflow's own guardrail already enforces. Unlike the morning pipeline,
    # this is not purely a delay workaround: check-stops and check-phantom are
    # read-check-act operations, so checking more often is strictly better —
    # it catches a stop-loss breach sooner, not just hedges against GitHub's
    # scheduler running hours late (observed: 3.5-9h delays this repo has
    # actually hit). No idempotency guard is needed or wanted here.
    - cron: '0 16 * * 1-5'    # 12:00 PM ET
    - cron: '30 14 * * 1-5'   # 10:30 AM ET
    - cron: '0 18 * * 1-5'    # 2:00 PM ET
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Skip the market-hours guardrail (for testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  midday-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run midday risk check
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}
        run: |
          chmod +x run_midday_github.sh
          bash run_midday_github.sh

      - name: Commit logs back to repo
        if: always()
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@youversion.com"
          # Rebase before committing: the morning pipeline may have pushed since
          # this job checked out, and a stale base makes the push fail.
          git add logs/paper/
          git diff --staged --quiet || git commit -m "chore: midday risk check $(TZ='America/New_York' date +%Y-%m-%d)"
          # Rebase AFTER committing — rebasing first fails with "cannot pull
          # with rebase: You have unstaged changes" on the freshly written logs.
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload midday log as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: midday-log-${{ github.run_id }}
          path: logs/paper/
          retention-days: 30
