name: Morning Trading Pipeline

on:
  schedule:
    # Primary target: 13:45 UTC = 9:45 AM ET (EDT) - after market open.
    #
    # GitHub Actions scheduled triggers are not guaranteed to run on time —
    # delays of several hours are a documented, observed behavior on this repo
    # (3.5h on 2026-08-27, 8-9h on 2026-08-27/28, and a full missed day on
    # 2026-08-31/09-01 with only the single cron below). run_github.sh's
    # GUARDRAIL G2 refuses to run past 11:30 AM ET (correctly — running
    # research against a stale morning trigger hours later is worse than not
    # running), so a large enough delay meant the ENTIRE trading day got zero
    # research and zero trades, not a late one.
    #
    # These three extra triggers are redundant attempts inside the same legal
    # window (before 11:30 AM ET / 15:30 UTC), not a wider window and not a
    # loosened guard. GUARDRAIL G1 (idempotency: skip if today's research
    # already ran) makes every trigger after the first a free no-op the
    # moment one succeeds, so this only ever adds chances to land inside the
    # window — it cannot cause a duplicate run.
    - cron: '45 13 * * 1-5'   # 9:45 AM ET target
    - cron: '15 14 * * 1-5'   # 10:15 AM ET backup
    - cron: '45 14 * * 1-5'   # 10:45 AM ET backup
    - cron: '15 15 * * 1-5'   # 11:15 AM ET backup — last chance before the 11:30 cutoff
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Skip time window guardrail (for testing outside market hours)'
        required: false
        default: 'false'
        type: boolean

jobs:
  morning-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning pipeline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}
        run: |
          chmod +x run_github.sh
          bash run_github.sh

      - name: Commit logs back to repo
        if: always()  # commit logs even if pipeline had warnings
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@youversion.com"
          git add logs/paper/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: trading logs $(TZ='America/New_York' date +%Y-%m-%d) morning"
          # options-pipeline.yml now runs in this same 9:35-11:30 AM ET window and
          # commits to the same branch. On 2026-09-02 both jobs committed within
          # 40s of each other; options pushed first, and morning's single
          # unretried push was rejected as non-fast-forward, failing the whole job
          # and losing that day's research/judge/trade output (never reached
          # origin — only existed on the runner that got torn down). A single
          # `git pull --rebase || true` followed by one unconditional `git push`
          # cannot recover from that: it swallows the rebase failure and then
          # fails hard on the push with no second attempt.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing onto latest ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git stash --include-untracked --quiet || true
            if ! git rebase "origin/${{ github.ref_name }}"; then
              echo "::error::Rebase conflict against origin/${{ github.ref_name }} - manual intervention needed"
              git rebase --abort
              git stash pop --quiet || true
              exit 1
            fi
            git stash pop --quiet || true
          done
          echo "::error::Failed to push logs after 5 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload run log as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: morning-log-${{ github.run_id }}
          path: logs/paper/
          retention-days: 30
