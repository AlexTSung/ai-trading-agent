name: Morning Trading Pipeline

on:
  schedule:
    # Primary target: 13:45 UTC = 9:45 AM ET (EDT) - after market open.
    #
    # GitHub Actions scheduled triggers are not guaranteed to run on time —
    # delays of several hours are a documented, observed behavior on this repo
    # (3.5h on 2026-08-27, 8-9h on 2026-08-27/28). The window used to end at
    # 11:30 AM ET with 4 attempts packed into the 105 minutes before it, on
    # the assumption that delays were occasional and roughly random. Instead,
    # on 2026-09-03, 09-04 and 09-07, GitHub delayed the ENTIRE block of
    # triggers by a similar multi-hour offset each day — all 4 attempts
    # landed between 1 PM and 3 PM ET, after every one of them had already
    # missed the cutoff. Three straight trading days produced zero real
    # research despite every scheduled run showing green.
    #
    # run_github.sh's GUARDRAIL G2 now allows research up to 4:00 PM ET,
    # matching midday-pipeline.yml's 10 AM-4 PM window, which got real checks
    # in on nearly all of those same delayed days. Two more backups spread
    # across the wider window (1:00 PM, 2:30 PM ET) mirror that pattern.
    # GUARDRAIL G1 (idempotency: skip if today's research already ran) makes
    # every trigger after the first a free no-op the moment one succeeds, so
    # this only ever adds chances to land inside the window — it cannot cause
    # a duplicate run.
    - cron: '45 13 * * 1-5'   # 9:45 AM ET target
    - cron: '15 14 * * 1-5'   # 10:15 AM ET backup
    - cron: '45 14 * * 1-5'   # 10:45 AM ET backup
    - cron: '15 15 * * 1-5'   # 11:15 AM ET backup
    - cron: '0 17 * * 1-5'    # 1:00 PM ET backup
    - cron: '30 18 * * 1-5'   # 2:30 PM ET backup — last chance before the 4:00 PM cutoff
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Skip time window guardrail (for testing outside market hours)'
        required: false
        default: 'false'
        type: boolean

jobs:
  morning-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning pipeline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}
        run: |
          chmod +x run_github.sh
          bash run_github.sh

      - name: Commit logs back to repo
        if: always()  # commit logs even if pipeline had warnings
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@youversion.com"
          git add logs/paper/
          git diff --staged --quiet || git commit -m "chore: trading logs $(TZ='America/New_York' date +%Y-%m-%d) morning"
          # Rebase AFTER committing. Running it first always failed with
          # "cannot pull with rebase: You have unstaged changes" because the
          # pipeline has just written new log files.
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload run log as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: morning-log-${{ github.run_id }}
          path: logs/paper/
          retention-days: 30
