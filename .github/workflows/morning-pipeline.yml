name: Morning Trading Pipeline

on:
  schedule:
    # Primary target: 13:52 UTC = 9:52 AM ET (EDT) - after market open.
    #
    # GitHub Actions scheduled triggers are not guaranteed to run on time —
    # delays of several hours are a documented, observed behavior on this repo
    # (3.5h on 2026-08-27, 8-9h on 2026-08-27/28, and a full missed day on
    # 2026-08-31/09-01 with only the single cron below, fixed by adding
    # redundant crons in v1.1.0). The window still ended at 11:30 AM ET with
    # 4 attempts packed into the 105 minutes before it, on the assumption
    # that delays were occasional and roughly random. Instead, on
    # 2026-09-03, 09-04 and 09-07, GitHub delayed the ENTIRE block of
    # triggers by a similar multi-hour offset each day — all 4 attempts
    # landed between 1 PM and 3 PM ET, after every one of them had already
    # missed the cutoff. Three straight trading days produced zero real
    # research despite every scheduled run showing green.
    #
    # run_github.sh's GUARDRAIL G2 now allows research up to 4:00 PM ET,
    # matching midday-pipeline.yml's 10 AM-4 PM window, which got real checks
    # in on nearly all of those same delayed days. Two more backups spread
    # across the wider window (1:00 PM, 2:30 PM ET) mirror that pattern.
    # GUARDRAIL G1 (idempotency: skip if today's research already ran) makes
    # every trigger after the first a free no-op the moment one succeeds, so
    # this only ever adds chances to land inside the window — it cannot cause
    # a duplicate run.
    #
    # Minutes moved off :00/:15/:30/:45 on 2026-09-18. Pulling the actual fire
    # times for the week of Sept 14-18 showed the real research run landing
    # 4-5 hours after every nominal target, every single day — not the
    # "occasional multi-hour delay" the wider window was built around, but a
    # near-daily one. GitHub's own scheduled-workflow docs say why: the
    # schedule event "can be delayed during periods of high load," and "high
    # load times include the start of every hour" — recommending a different
    # minute specifically to avoid it. Every cron below had been sitting on
    # the exact 15-minute grid (:00/:15/:30/:45) most other repos' schedules
    # also default to, i.e. the most congested minutes on GitHub's triggering
    # infrastructure. Moved to :52/:22/:52/:22/:07/:37 — off that grid, and
    # the 1 PM slot specifically off :00, the single worst-documented minute.
    - cron: '52 13 * * 1-5'   # 9:52 AM ET target
    - cron: '22 14 * * 1-5'   # 10:22 AM ET backup
    - cron: '52 14 * * 1-5'   # 10:52 AM ET backup
    - cron: '22 15 * * 1-5'   # 11:22 AM ET backup
    - cron: '7 17 * * 1-5'    # 1:07 PM ET backup
    - cron: '37 18 * * 1-5'   # 2:37 PM ET backup
    # These schedule: crons are a zero-cost fallback layer, not the primary
    # trigger — see CLAUDE.md "External trigger" section. The primary trigger
    # is an external cron-job.org job calling workflow_dispatch hourly, around
    # the clock, every day (confirmed 2026-10-13). run_github.sh's old "4:00
    # PM cutoff, last chance before close" framing (which the "2:37 PM ET
    # backup" comment above still reflects) no longer applies: its time-window
    # guardrail was removed the same day in favor of a rolling re-run interval
    # that re-runs hourly all day, so there is no longer a single "last
    # chance" trigger to protect.
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'No effect on run_github.sh since 2026-10-13 (its time-window guardrail was removed); kept for parity with the other pipelines'' workflow_dispatch inputs'
        required: false
        default: 'false'
        type: boolean

jobs:
  morning-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning pipeline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}
        run: |
          chmod +x run_github.sh
          bash run_github.sh

      - name: Commit logs back to repo
        if: always()  # commit logs even if pipeline had warnings
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@youversion.com"
          git add logs/paper/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: trading logs $(TZ='America/New_York' date +%Y-%m-%d) morning"
          # options-pipeline.yml now runs in this same 9:35-11:30 AM ET window and
          # commits to the same branch. On 2026-09-02 both jobs committed within
          # 40s of each other; options pushed first, and morning's single
          # unretried push was rejected as non-fast-forward, failing the whole job
          # and losing that day's research/judge/trade output (never reached
          # origin — only existed on the runner that got torn down). A single
          # `git pull --rebase || true` followed by one unconditional `git push`
          # cannot recover from that: it swallows the rebase failure and then
          # fails hard on the push with no second attempt.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing onto latest ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git stash --include-untracked --quiet || true
            if ! git rebase "origin/${{ github.ref_name }}"; then
              echo "::error::Rebase conflict against origin/${{ github.ref_name }} - manual intervention needed"
              git rebase --abort
              git stash pop --quiet || true
              exit 1
            fi
            git stash pop --quiet || true
          done
          echo "::error::Failed to push logs after 5 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload run log as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: morning-log-${{ github.run_id }}
          path: logs/paper/
          # 30 days × hourly runs across 4 equities workflows exhausted the
          # repo's Actions artifact storage quota on 2026-10-20 (every run
          # from ~5 AM ET onward that day failed at this step with "Artifact
          # storage quota has been hit" — the actual pipeline and git push
          # above still succeeded; only this cosmetic upload failed, but it
          # marked the whole job red). The artifact is redundant with
          # logs/paper/ already being committed to git by the step above, so
          # it only needs to survive long enough for same-day debugging.
          retention-days: 1
