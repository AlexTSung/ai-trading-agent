name: Forex Trading Agent

on:
  schedule:
    # Tokyo session — JPY/AUD carry pairs (00–08 UTC, every 2h) Mon-Fri
    - cron: '0 0,2,4,6,8 * * 1-5'
    # London/NY overlap — highest liquidity (12–18 UTC, every 2h) Mon-Fri
    - cron: '0 12,14,16,18 * * 1-5'
    # NY close + Asia pre-open carry entries Mon-Fri
    - cron: '0 22 * * 1-5'
    # Weekly strategy learner — Sunday 08:00 UTC (before Monday open)
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - dry-run
          - scan-only
          - judge-only
          - sync-journal
          - status
          - weekly-learn
          - patterns

env:
  OANDA_ENV: practice
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write   # allow GITHUB_TOKEN to push commit-back

jobs:
  run-forex-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.OANDA_API_KEY }}" ]; then
            echo "ERROR: OANDA_API_KEY secret is not set in this repo."
            echo "Go to: Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.OANDA_ACCOUNT_ID }}" ]; then
            echo "ERROR: OANDA_ACCOUNT_ID secret is not set in this repo."
            exit 1
          fi
          echo "Secrets OK."

      - name: Run forex agent
        env:
          OANDA_API_KEY:      ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID:   ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV:          practice
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "Running forex agent in mode: $MODE"
          case "$MODE" in
            full)         python3 run_forex.py ;;
            dry-run)      python3 run_forex.py --dry-run ;;
            scan-only)    python3 run_forex.py --scan-only ;;
            judge-only)   python3 run_forex.py --judge-only ;;
            sync-journal) python3 run_forex.py --sync-journal ;;
            status)       python3 run_forex.py --status ;;
            weekly-learn) python3 forex_optimizer.py weekly ;;
            patterns)     python3 forex_optimizer.py patterns ;;
          esac

      - name: Graduation checker + post-trade learning
        if: always() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'full')
        continue-on-error: true
        env:
          OANDA_API_KEY:    ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV:        practice
        run: python3 forex_graduation.py eod

      - name: Run optimizer (tune weights from journal)
        if: always() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'full')
        continue-on-error: true
        env:
          OANDA_API_KEY:    ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV:        practice
        run: python3 forex_optimizer.py daily

      - name: Weekly strategy scrape (Sundays)
        if: github.event.schedule == '0 8 * * 0'
        continue-on-error: true
        env:
          OANDA_API_KEY:    ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV:        practice
        run: python3 forex_optimizer.py weekly

      - name: Commit updated journal + config back to repo
        if: always()
        run: |
          git config user.name  "forex-agent[bot]"
          git config user.email "forex-agent@noreply.github.com"

          # Stage agent memory files only — never credentials or big logs
          git add -f \
            logs/forex/trade_journal.json \
            logs/forex/*_research.json \
            logs/forex/*_verdicts.json \
            logs/forex/*_scan.json \
            logs/forex/*_trades.json \
            logs/forex/*_reflection.md \
            logs/forex/graduation-*.md \
            logs/forex/learning_log.jsonl \
            forex_config.json \
            strategies/forex_learnings.md 2>/dev/null || true

          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "agent: forex run ${TIMESTAMP}"
            git push origin HEAD || echo "WARN: push failed — logs saved as artifact"
          else
            echo "No changes to commit."
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: forex-logs-${{ github.run_number }}
          path: |
            logs/forex/trade_journal.json
            logs/forex/*_verdicts.json
            logs/forex/*_scan.json
            logs/forex/graduation-*.md
            forex_config.json
          retention-days: 30
          if-no-files-found: ignore
