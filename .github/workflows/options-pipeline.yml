name: Options Trading Pipeline

on:
  schedule:
    # Same window and redundant-trigger pattern as morning-pipeline.yml: a
    # primary target inside 9:35 AM-4:00 PM ET, plus backups so a GitHub
    # Actions scheduler delay (observed on this repo: 3.5-9h, and on
    # 2026-09-03/04/07 an entire block of same-day triggers delayed by a
    # similar multi-hour offset together) can't zero out an entire day.
    # run_options_github.sh's GUARDRAIL G1 makes every trigger after the
    # first a free no-op once one succeeds. Window widened from 11:30 AM to
    # 4:00 PM on 2026-09-08 for the same reason and on the same day as
    # morning-pipeline.yml — see run_options_github.sh's GUARDRAIL G2 comment
    # for the freshness-vs-reliability tradeoff that widening this window
    # specifically (unlike the equities side) does trade away.
    #
    # This workflow did not exist before 2026-09-02. CLAUDE.md's
    # options-improvements list has said "Schedule it" since the strategy was
    # first written down — equities and forex ran in GitHub Actions, options
    # only ever ran from a local run_options.sh tied to one machine being on.
    # Short options are the LEAST safe thing to monitor intermittently.
    - cron: '40 13 * * 1-5'   # 9:40 AM ET target
    - cron: '10 14 * * 1-5'   # 10:10 AM ET backup
    - cron: '10 15 * * 1-5'   # 11:10 AM ET backup
    - cron: '5 17 * * 1-5'    # 1:05 PM ET backup
    - cron: '35 18 * * 1-5'   # 2:35 PM ET backup — last chance before the 4:00 PM cutoff
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Skip the market-hours guardrail (for testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  options-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run options pipeline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}
        run: |
          chmod +x run_options_github.sh
          bash run_options_github.sh

      - name: Commit logs back to repo
        if: always()
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@youversion.com"
          git add logs/options/
          git diff --staged --quiet || git commit -m "chore: options run $(TZ='America/New_York' date +%Y-%m-%d)"
          # Rebase AFTER committing — the pipeline writes new files before this
          # step runs, so rebasing first fails on unstaged changes.
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload options log as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: options-log-${{ github.run_id }}
          path: logs/options/
          retention-days: 30
