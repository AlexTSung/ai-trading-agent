name: EOD Trading Pipeline

on:
  schedule:
    # 21:15 UTC = 5:15 PM ET (EDT, UTC-4) - after market close + 1hr buffer.
    # One backup trigger, same pattern as morning/midday: GUARDRAIL G1
    # (idempotency — skip if today's EOD already ran) makes it a free no-op
    # once the primary succeeds, so this only adds a second chance if the
    # first is delayed or the runner never starts.
    - cron: '15 21 * * 1-5'   # 5:15 PM ET target
    - cron: '0 22 * * 1-5'    # 6:00 PM ET backup
  workflow_dispatch:

jobs:
  eod-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD pipeline
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          chmod +x run_eod_github.sh
          bash run_eod_github.sh

      - name: Commit logs back to repo
        if: always()
        run: |
          git config user.name "Trading Agent"
          git config user.email "agent@youversion.com"
          git add logs/paper/ logs/learnings/ CLAUDE.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: trading logs $(TZ='America/New_York' date +%Y-%m-%d) EOD + learnings"
          # Other pipelines (morning, options, midday) may also commit to the
          # same branch — a single unretried push can lose this run's output to
          # whichever job wins the race (observed 2026-09-02 on morning vs.
          # options). Retry with fetch+rebase on rejection instead of one
          # `git pull --rebase || true` followed by an unconditional push.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing onto latest ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git stash --include-untracked --quiet || true
            if ! git rebase "origin/${{ github.ref_name }}"; then
              echo "::error::Rebase conflict against origin/${{ github.ref_name }} - manual intervention needed"
              git rebase --abort
              git stash pop --quiet || true
              exit 1
            fi
            git stash pop --quiet || true
          done
          echo "::error::Failed to push logs after 5 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EOD log as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eod-log-${{ github.run_id }}
          path: logs/paper/
          retention-days: 30
